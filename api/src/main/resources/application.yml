server:
  port: ${SERVER_PORT:${PORT:8040}}

spring:
  application:
    name: contracts-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/contracts}
    username: ${SPRING_DATASOURCE_USERNAME:contracts_app}
    password: ${SPRING_DATASOURCE_PASSWORD:contracts_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${JWT_SECRET:dev-only-change-me-please-use-32bytes-min!!}
  jwt-hours: 12
  document-dir: ${DOCUMENT_DIR:./data/documents}
  cors-origins: ${FRONTEND_ORIGINS:http://localhost:3040,http://127.0.0.1:3040}
